<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Dashboard</title>
    <link rel="stylesheet" href="../assests/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha384-5e2ESR8Ycmos6g3gAKr1Jvwye8sW4U1u/cAKulfVJnkakCcMqhOudbtPnvJ+nbv7" crossorigin="anonymous">
    <script>
      document.addEventListener('DOMContentLoaded', function () {
    const loggedInUser = JSON.parse(localStorage.getItem('loggedInUser'));

    // If no user is logged in, redirect to login page
    if (!loggedInUser) {
        // alert('You need to log in to access this page.');
        window.location.href = '../auth/login/login.html'; // Redirect to login
    } else {
        // Display logged-in user's name and role in the dashboard
        const userProfile = document.querySelector('.user-profile span');
        if (userProfile) {
            userProfile.textContent = `Welcome, ${loggedInUser.firstName}`;
        }
    }
});

    </script>
  </head>
<body>

    <div id="sidebar-container"></div> <!-- Container for the sidebar -->
    
  <div class="dashboard">
    <!-- Main Content Area -->
    <div class="main-content">
      <!-- Header (User Profile Only) -->
      <header class="header">
        <div class="user-profile">
          <img src="../assests/images/user.webp" alt="User Image">
          <span>User Name</span>
        </div>
      </header>

      <!-- Widgets Section -->
      <section class="widgets">
        <div class="widget" id="revenueWidget">
          <h3><i class="fas fa-user-shield"></i> Admins</h3>
          <p>0</p>
        </div>
        <div class="widget" id="usersWidget">
          <h3><i class="fas fa-user-graduate"></i> Students</h3>
          <p>0</p>
        </div>
        <div class="widget" id="messagesWidget">
          <h3><i class="fas fa-chalkboard-teacher"></i> Staff</h3>
          <p>0</p>
        </div>
        <div class="widget" id="announcementsWidget">
          <h3><i class="fas fa-bullhorn"></i> Announcements</h3>
          <p>0</p>
        </div>
      </section>

      <!-- Quick Actions Section -->
      <section class="quick-actions">
        <h2>Quick Actions</h2>
        <div class="actions-container">
          <button class="action-btn" onclick="window.location.href='../modules/announcements/main.html'">
            <i class="fas fa-plus-circle"></i> Create Announcement
          </button>
          <button class="action-btn" onclick="window.location.href='../modules/announcements/main.html'">
            <i class="fas fa-list"></i> View All Announcements
          </button>
        </div>
      </section>

      <!-- Recent Activity Section -->
      <section class="recent-activity">
        <h2>Recent Announcements</h2>
        <div id="recentAnnouncementsList" class="announcements-preview">
          <p class="no-data">No announcements yet. Create your first one!</p>
        </div>
      </section>


  <script>
    // Load the sidebar HTML
    document.addEventListener("DOMContentLoaded", function() {
        fetch('../components/sideBar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('sidebar-container').innerHTML = data;
                initializeSidebarNavigation();
            })
            .catch(error => console.error('Error loading sidebar:', error));
    });
    
    // Function to initialize sidebar navigation
    function initializeSidebarNavigation() {
        const navLinks = document.querySelectorAll('.nav-link');
        const basePath = '../'; // We're in dashboard folder
        navLinks.forEach(link => {
            const page = link.getAttribute('data-page');
            if (page === 'admin') {
                link.href = 'admin.html';
            } else if (page === 'announcements') {
                link.href = basePath + 'modules/announcements/main.html';
            } else if (page === 'manage-users') {
                link.href = basePath + 'admin/manage-users.html';
            }
        });
        // Only show Manage Users for admin
        const loggedInUser = JSON.parse(localStorage.getItem('loggedInUser'));
        if (loggedInUser && loggedInUser.role === 'admin') {
            const manageUsersNav = document.getElementById('manageUsersNav');
            if (manageUsersNav) manageUsersNav.style.display = '';
        }
    }
</script>
  <script src="script.js"></script>
</body>
</html>
