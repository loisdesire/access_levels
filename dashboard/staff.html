
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Dashboard</title>
  <link rel="stylesheet" href="../assests/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha384-5e2ESR8Ycmos6g3gAKr1Jvwye8sW4U1u/cAKulfVJnkakCcMqhOudbtPnvJ+nbv7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Chart.js CDN -->
</head>
<body>

    <div id="sidebar-container"></div> <!-- Container for the sidebar -->
    
  <div class="dashboard">
    <!-- Main Content Area -->
    <div class="main-content">
      <!-- Header (User Profile Only) -->
      <header class="header">
        <div class="user-profile">
          <img src="../assests/images/user.webp" alt="User Image">
          <span>User Name</span>
        </div>
      </header>

      <!-- Widgets Section -->
      <section class="widgets">
        <div class="widget" id="myAnnouncementsWidget">
          <h3><i class="fas fa-megaphone"></i> My Announcements</h3>
          <p>0</p>
        </div>
        <div class="widget" id="totalAnnouncementsWidget">
          <h3><i class="fas fa-bullhorn"></i> Total Announcements</h3>
          <p>0</p>
        </div>
      </section>

      <!-- Quick Actions Section -->
      <section class="quick-actions">
        <h2>Quick Actions</h2>
        <div class="actions-container">
          <button class="action-btn" onclick="window.location.href='../modules/announcements/main.html'">
            <i class="fas fa-plus-circle"></i> Create Announcement
          </button>
          <button class="action-btn" onclick="window.location.href='../modules/announcements/main.html'">
            <i class="fas fa-list"></i> View All Announcements
          </button>
        </div>
      </section>

      <!-- Recent Announcements Section -->
      <section class="recent-activity">
        <h2>Recent Announcements</h2>
        <div id="recentAnnouncementsList" class="announcements-preview">
          <p class="no-data">No announcements yet.</p>
        </div>
      </section>


  <script>
    // Load the sidebar HTML
    document.addEventListener("DOMContentLoaded", function() {
  fetch('../components/sideBar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('sidebar-container').innerHTML = data;
                
                // Initialize sidebar navigation after it's loaded
                initializeSidebarNavigation();
            })
            .catch(error => console.error('Error loading sidebar:', error));
    });
    
    // Function to initialize sidebar navigation
    function initializeSidebarNavigation() {
        const navLinks = document.querySelectorAll('.nav-link');
        const basePath = '../'; // We're in dashboard folder
        
        navLinks.forEach(link => {
            const page = link.getAttribute('data-page');
            if (page === 'admin') {
                link.href = 'admin.html';
            } else if (page === 'announcements') {
                link.href = basePath + 'modules/announcements/main.html';
            }
        });
    }
</script>
  <script src="script.js"></script>
</body>
</html>
