<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements</title>
    <link rel="stylesheet" href="../../assests/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha384-5e2ESR8Ycmos6g3gAKr1Jvwye8sW4U1u/cAKulfVJnkakCcMqhOudbtPnvJ+nbv7" crossorigin="anonymous">
</head>
<body>

    <div id="sidebar-container"></div> <!-- Sidebar -->

    <div class="dashboard">
        <div class="main-content">
            <header class="header">
                <div class="user-profile">
                    <img src="../../assests/images/user.webp" alt="User Image">
                    <span>User name</span>
                </div>
            </header>

            <section class="announcement-section">
                <h3>Announcements</h3>

                <div id="announcement-list">
                    <!-- Announcement items will be dynamically inserted here -->
                </div>

                <!-- Admin and staff can create/edit announcements -->
                <div id="announcement-actions">
                    <input id="announcement-title" type="text" placeholder="Announcement Title" style="width:100%;margin-bottom:10px;padding:10px;font-size:15px;border-radius:6px;border:1px solid #d0d0d0;">
                    <textarea id="announcement-text" placeholder="Write an announcement..."></textarea>
                    <button id="create-btn" class="create-btn">Create Announcement</button>
                </div>
            </section>
        </div>
    </div>

    <script>
        // Load the sidebar HTML
        document.addEventListener("DOMContentLoaded", function() {
            fetch('../../components/sideBar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('sidebar-container').innerHTML = data;
                    
                    // Initialize sidebar navigation after it's loaded
                    initializeSidebarNavigation();
                })
                .catch(error => console.error('Error loading sidebar:', error));
        });
        
        // Function to initialize sidebar navigation
        function initializeSidebarNavigation() {
            const navLinks = document.querySelectorAll('.nav-link');
            const basePath = '../../'; // We're in modules/announcements folder
            
            navLinks.forEach(link => {
                const page = link.getAttribute('data-page');
                if (page === 'admin') {
                    link.href = basePath + 'dashboard/admin.html';
                } else if (page === 'announcements') {
                    link.href = 'main.html';
                }
            });
        }
    </script>

    <script src="main.js"></script>
</body>
</html>
